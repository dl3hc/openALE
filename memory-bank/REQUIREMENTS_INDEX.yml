      - id: AC-SYNC-003-2
        text: "Zwischen zwei getrennten Übertragungen wird keine fortgesetzte Wortphasenbeziehung aufrechterhalten."
        status: open
  - id: REQ-SYNC-004
    title: "Unabhängigkeit des Sendemodulators vom Empfänger"
    spec: "A.5.2.6.1"
