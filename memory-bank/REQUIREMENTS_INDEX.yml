      - id: AC-GEN-014-4
        text: "Einzeln gerufene Stationen müssen sofort antworten."
        status: open
      - id: AC-GEN-014-5
        text: "Stationen ohne Netz-Member-Adresse zu einer Netzrufadresse müssen in den verlinkten Zustand eintreten, ohne zu antwor..."
        status: open
  - id: REQ-GEN-015
    title: "Fremdstations-Tabelle: Mindestens 100 Einträge"
    spec: "A.4.3.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-GEN-015-1
        text: "Das System muss mindestens 100 Fremdstations-Einträge speichern können."
        status: open
      - id: AC-GEN-015-2
        text: "Jeder Eintrag muss Adresse, Kanalqualitätsdaten und gerätespezifische Link-Einstellungen enthalten können."
        status: open
  - id: REQ-GEN-016
    title: "Fremdstations-Adressspeicher: Individuelle Einträge und Netzinformationen, nichtflüchtig"
    spec: "A.4.3.3.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-GEN-016-1
        text: "Individuelle Stationsadressen müssen in separaten Einträgen gespeichert sein."
        status: open
      - id: AC-GEN-016-2
        text: "Jeder Eintrag kann eine spezifische Twr-Wartezeit enthalten."
        status: open
      - id: AC-GEN-016-3
        text: "Netzinformationen müssen Netz-Member-Zuordnungen, Slot-Sequenzen und Twrn enthalten."
        status: open
      - id: AC-GEN-016-4
        text: "Der Speicher muss nichtflüchtig sein."
        status: open
  - id: REQ-GEN-017
    title: "LQA-Speicher: Mindestens 4000 Einträge, 1 Stunde Pufferung"
    spec: "A.4.3.3.2"
    priority: MUST
    status: offen
    ac:
      - id: AC-GEN-017-1
        text: "Das System muss mindestens 4000 LQA-Einträge halten können."
        status: open
      - id: AC-GEN-017-2
        text: "Der LQA-Speicher muss bei Stromausfall mindestens 1 Stunde lang erhalten bleiben."
        status: open
      - id: AC-GEN-017-3
        text: "Jede Zelle muss bilaterale SINAD-Werte enthalten."
        status: open
      - id: AC-GEN-017-4
        text: "Jede Zelle muss eine Altersanzeige oder einen Gewichtsreduzierungsalgorithmus für ältere Daten enthalten."
        status: open
  - id: REQ-GEN-018
    title: "Fremdstations-Einstellungen: Nichtflüchtige Speicherung (DO)"
    spec: "A.4.3.3.3"
    priority: COULD
    status: offen
    ac:
      - id: AC-GEN-018-1
        text: "Das System soll station- und netzspezifische Einstellungen in nichtflüchtigem Speicher ablegen können."
        status: open
  - id: REQ-GEN-019
