        status: open
  - id: REQ-GEN-009
    title: "Belegtheitserkennung (NT): Mindestwahrscheinlichkeiten gemäß Tabelle A-I"
    spec: "A.4.2.2, Tabelle A-I"
    priority: SHOULD
    status: offen
    ac:
      - id: AC-GEN-009-1
        text: "Die Belegtheitserkennung muss für alle Wellenformen aus Tabelle A-I die dort angegebenen Mindestwahrscheinlichkeiten ..."
