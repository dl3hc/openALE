        status: open
      - id: AC-GEN-010-3
        text: "Die maximale Zeit vom Rufbeginn bis zum Linkaufbau darf 14,000 s (zuzüglich Simulator-Verzögerung) nicht überschreiten."
        status: open
      - id: AC-GEN-010-4
        text: "Der Ruf darf maximal 23, Antwort und Bestätigung je maximal 3 redundante Wörter umfassen."
        status: open
  - id: REQ-GEN-011
