    ac:
      - id: AC-SYNC-001-1
        text: "Das System erfordert keine systemweite externe Synchronisation und muss auch ohne diese korrekt arbeiten."
        status: open
      - id: AC-SYNC-001-2
        text: "Das System ist mit Verfahren zur systemweiten Synchronisation kompatibel, sofern solche eingesetzt werden."
        status: open
      - id: AC-SYNC-001-3
        text: "Die innerhalb eines Frames eingebettete Timing- und Strukturinformation wird zur Erzielung und Aufrechterhaltung der ..."
        status: open
  - id: REQ-SYNC-002
    title: "Konstante Wortphasenbeziehung im Sendemodulator"
    spec: "A.5.2.6.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-SYNC-002-1
        text: "Nach Beginn der ersten Übertragung hält der Sendemodulator die konstante Phasenbeziehung zwischen allen gesendeten dr..."
        status: open
      - id: AC-SYNC-002-2
        text: "Die Differenz der Ereigniszeitpunkte zweier dreifach-redundanter Wörter innerhalb einer Übertragung ist stets ein gan..."
