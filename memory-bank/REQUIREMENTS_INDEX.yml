        text: "Alle drei Zeichen müssen innerhalb des Basic-38-ASCII-Subsets liegen, wenn eine Routing-Präambel (z. B. TO) dekodiert..."
        status: open
      - id: AC-SYNC-006-8
        text: "Bei einem initialen REP ist eine beliebige Bitkombination bedingt akzeptabel; ohne die notwendige Kenntnis des vorher..."
        status: open
  - id: REQ-SYNC-007
    title: "Herstelleroptimierbare Parameter: Unanimous-Vote-Schwellwert und Golay-Modus"
    spec: "A.5.2.6.3"
    priority: SHOULD
    us: US-SYNC-002
    status: offen
