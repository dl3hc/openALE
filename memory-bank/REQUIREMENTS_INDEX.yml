        text: "Als Designziel (DO) wird eine automatische Anpassung von unanimous-vote-Schwellwert und Golay-Modus unter wechselnden..."
        status: open

  # --- SOUND ---
  - id: REQ-SOUND-002
    title: "Sounding: Einseitige, periodische Übertragung auf unbesetzten Kanälen"
    spec: "A.5.3.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-SOUND-002-1
        text: "Sounding ist eine einseitige, einwegige Übertragung."
        status: open
      - id: AC-SOUND-002-2
        text: "Sounding wird in periodischen Intervallen auf unbesetzten Kanälen durchgeführt."
        status: open
      - id: AC-SOUND-002-3
        text: "Sounding ist keine interaktive, zweiseitige Technik."
        status: open
      - id: AC-SOUND-002-4
        text: "Die Identifizierung durch Hören des Sounding-Signals gibt eine hohe Wahrscheinlichkeit für zweiseitige Konnektivität."
        status: open
      - id: AC-SOUND-002-5
        text: "Sounding kann passiv am Empfänger erfolgen."
        status: open
      - id: AC-SOUND-002-6
        text: "Sounding verwendet die standardmäßige ALE-Signalisierung."
        status: open
      - id: AC-SOUND-002-7
        text: "Jede Station kann Sounding-Signale empfangen."
        status: open
      - id: AC-SOUND-002-8
        text: "Die Adresse-Information muss dem Bediener als Minimum angezeigt werden."
        status: open
      - id: AC-SOUND-002-9
        text: "Stationen mit Konnektivitäts- und LQA-Speichern müssen die Information speichern und später für den Linkaufbau verwen..."
        status: open
      - id: AC-SOUND-002-10
        text: "Wenn eine Station kürzlich auf einem zum Sounding vorgesehenen Kanal gesendet hat, kann das erneute Senden entfallen,..."
        status: open
      - id: AC-SOUND-002-11
        text: "Antworten eines abgehörten Netzes (oder einer Gruppe) dienen als Sounding-Signale für die anderen Netz-(oder Gruppen-..."
        status: open
      - id: AC-SOUND-002-12
        text: "Alle Stationen müssen periodisches Sounding auf vorab vereinbarten Kanälen durchführen können."
        status: open
      - id: AC-SOUND-002-13
        text: "Die Sounding-Fähigkeit kann selektiv vom Bediener oder Controller aktiviert werden."
        status: open
      - id: AC-SOUND-002-14
        text: "Der Zeitraum zwischen den Sounds kann vom Bediener oder Controller einstellbar sein."
        status: open
      - id: AC-SOUND-002-15
        text: "Verfügbare Stationen müssen Adressen aller gehörter Stationen automatisch und temporär anzeigen, mit einem vom Bedien..."
        status: open
  - id: REQ-SOUND-003
    title: "Sounding-Struktur: Identisch zum Basic Call, ohne Calling Cycle und Message"
    spec: "A.5.3.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-SOUND-003-1
        text: "Die Struktur des Sounds ist identisch mit dem Basic Call, mit Ausnahmen des Calling Cycles und des Message-Abschnitts."
        status: open
      - id: AC-SOUND-003-2
        text: "Der Conclusion (Terminator) muss gesendet werden, um die sendende Station zu identifizieren."
        status: open
      - id: AC-SOUND-003-3
        text: "Nur entweder TIS oder TWAS wird verwendet, niemals beide im selben Frame."
        status: open
      - id: AC-SOUND-003-4
        text: "Der Worttyp TIS zeigt an, dass potenzielle Anrufer ermutigt werden."
        status: open
      - id: AC-SOUND-003-5
        text: "Der Worttyp TWAS zeigt an, dass potenzielle Anrufer ignoriert werden sollen."
        status: open
  - id: REQ-SOUND-004
    title: "Minimale redundante Sounding-Zeit (Trs)"
    spec: "A.5.3.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-SOUND-004-1
        text: "Die minimale redundante Sounding-Zeit (Trs) muss 784 ms betragen."
        status: open
  - id: REQ-SOUND-005
    title: "Single-Channel Sounding-Protokoll"
    spec: "A.5.3.2"
    priority: MUST
    status: offen
    ac:
      - id: AC-SOUND-005-1
        text: "Alle Stationen besitzen die fundamentale Fähigkeit zum automatischen Single-Channel Sounding gemäß dem Standard-Proto..."
        status: open
      - id: AC-SOUND-005-2
        text: "Stationen können optional das Protokoll für Single-Channel Sounding, Connectivity Tracking und Verfügbarkeitsübertrag..."
        status: open
      - id: AC-SOUND-005-3
        text: "Das Basis-Sounding-Protokoll besteht nur aus dem Sound."
        status: open
      - id: AC-SOUND-005-4
        text: "Der Sound enthält die eigene Adresse der sendenden Station."
        status: open
      - id: AC-SOUND-005-5
        text: "Wenn eine Station Anrufer ermutigt und einen empfängt, folgt sie dem optionalen Handshake-Protokoll aus A.5.3.4."
        status: open
      - id: AC-SOUND-005-6
        text: "Wenn eine Station Anrufer ignorieren will, verwendet sie TWAS und kehrt sofort zu "available" zurück."
        status: open
      - id: AC-SOUND-005-7
        text: "Multikanal-Stationen können periodisch zu einem Single-Channel-Netz senden, um Aktivität und Verfügbarkeit zu melden."
        status: open
      - id: AC-SOUND-005-8
        text: "Bei Empfang eines Sounds müssen Empfänger die Adresse anzeigen und bei Verfügbarkeit Konnektivitätsinformation speich..."
        status: open
  - id: REQ-SOUND-006
    title: "Multichannel Sounding: Kompatibilität mit Scanning"
    spec: "A.5.3.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-SOUND-006-1
        text: "Sounding ist mit dem Scanning-Timing kompatibel."
        status: open
      - id: AC-SOUND-006-2
        text: "Alle Stationen können Scanning-Sounding-Protokolle durchführen, auch auf fester Frequenz."
        status: open
      - id: AC-SOUND-006-3
        text: "Die Protokolle stellen einseitige Konnektivität auf jedem verfügbaren, gemeinsam abgetasteten Kanal sicher und bestät..."
        status: open
      - id: AC-SOUND-006-4
        text: "Stationen verwenden die Protokolle für Multichannel Sounding, Connectivity Tracking und Verfügbarkeitsübertragung."
        status: open
  - id: REQ-SOUND-007
    title: "Multichannel Sounding: Timing-Berechnung für Scanning Sound Frame"
    spec: "A.5.3.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-SOUND-007-1
        text: "Alle Timing-Betrachtungen und Berechnungen für individuelles Scanning Calling gelten auch für Scanning Sounding."
        status: open
      - id: AC-SOUND-007-2
        text: "Der Scanning Sound unterscheidet sich vom Single-Channel Sound durch die Erweiterung von Trs durch Tss zu Tsrs."
        status: open
      - id: AC-SOUND-007-3
        text: "Die Beziehung muss gelten: Tsrs = Tss + Trs."
        status: open
      - id: AC-SOUND-007-4
        text: "Tss hat den gleichen Zweck wie Tsc für eine äquivalente Scanning-Situation."
        status: open
      - id: AC-SOUND-007-5
        text: "Kanal-Scanning-Sequenzen und Auswahlkriterien für Scanning Calling gelten auch für Scanning Sounding."
        status: open
      - id: AC-SOUND-007-6
        text: "Das "Sound Set" für sondierende Kanäle ist üblicherweise identisch mit dem "Scan Set"."
        status: open
  - id: REQ-SOUND-008
    title: "Call-Rejection Scanning Sounding Protocol"
    spec: "A.5.3.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-SOUND-008-1
        text: "Bei geplantem Ignorieren von Anrufern muss das Call-Rejection Scanning Sounding Protocol verwendet werden."
        status: open
      - id: AC-SOUND-008-2
        text: "Die Station landet auf dem ersten Kanal im Scan Set und wartet (Twt), um die Kanalbelegung zu prüfen."
        status: open
      - id: AC-SOUND-008-3
        text: "Nach dem Abstimmen (Tt) geht die Station auf volle Leistung und initiiert den Scanning Sound Frame."
        status: open
      - id: AC-SOUND-008-4
        text: "Der Scanning Sound muss den Scan-Perioden der Empfänger-Stationen um mindestens Trs überschreiten, um Tdrw ≥ 784 ms s..."
        status: open
      - id: AC-SOUND-008-5
        text: ""TWAS A" wird redundant verwendet, um mitzuteilen, dass keine Anrufe erwartet werden."
        status: open
      - id: AC-SOUND-008-6
        text: "Nach dem Scanning Sound Frame verlässt die Station sofort den Kanal und geht zum nächsten Kanal im Sound Set."
        status: open
      - id: AC-SOUND-008-7
        text: "Das Verfahren wiederholt sich, bis alle Kanäle gesendet oder übersprungen (bei Belegung) wurden."
        status: open
      - id: AC-SOUND-008-8
        text: "Nach Erschöpfung aller Sound Set Kanäle kehrt die Station automatisch zum "available" receive scan mode zurück."
        status: open
  - id: REQ-SOUND-009
    title: "Scanning Detection: Mindestens eine Erfassungsmöglichkeit pro Kanal"
    spec: "A.5.3.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-SOUND-009-1
        text: "Das Timing von Sounding- und Scanning-Stationen ist vorab vereinbart, um mindestens eine Erfassungsmöglichkeit pro Ka..."
        status: open
      - id: AC-SOUND-009-2
        text: "Die scannende Station muss mindestens drei redundante Wörter des Sounding-Senders lesen können."
        status: open
      - id: AC-SOUND-009-3
        text: "Die scannende Station speichert die Konnektivitätsinformation und setzt das Scanning fort."
        status: open
  - id: REQ-SOUND-010
    title: "Call-Acceptance Scanning Sounding Protocol"
    spec: "A.5.3.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-SOUND-010-1
        text: "Bei geplantem Begrüßen von Anrufern verwendet Station "A" seine normale Scanning Dwell Time (Td) oder Twt, whichever ..."
        status: open
      - id: AC-SOUND-010-2
        text: "Bei freiem Kanal initiiert "A" den Scanning Sound mit "TIS A"."
        status: open
      - id: AC-SOUND-010-3
        text: ""A" soundet für die gleiche Zeitdauer wie beim Call-Rejection Protocol."
        status: open
      - id: AC-SOUND-010-4
        text: "Am Ende des Sounding Frame wartet "A" für Anrufe gemäß Twrt (z. B. 6 Tw für schnell-abstimmende Stationen)."
        status: open
      - id: AC-SOUND-010-5
        text: "Während des Wartens hört "A" auf assoziierte und nicht-assozierte Anrufe sowie auf andere Sounds."
        status: open
      - id: AC-SOUND-010-6
        text: "Gehörte andere Sounds werden als Konnektivitätsinformation gespeichert, wenn die Station polling-fähig ist."
        status: open
      - id: AC-SOUND-010-7
        text: "Wenn keine Anrufe empfangen wurden, verlässt "A" den Kanal."
        status: open
  - id: REQ-SOUND-011
    title: "Optionales Handshake: Getriggert durch Konnektivität vom Sounding"
    spec: "A.5.3.4"
    priority: SHOULD
    status: offen
    ac:
      - id: AC-SOUND-011-1
        text: "Ein optionales Handshake kann unmittelbar nach einem Sounding mit einer gerufenen Station durchgeführt werden."
        status: open
      - id: AC-SOUND-011-2
        text: "Das Handshake-Protokoll ist identisch mit dem Single-Channel Individual Call Protocol, außer dem Trigger-Mechanismus."
        status: open
      - id: AC-SOUND-011-3
        text: "Das Handshake kann manuell oder automatisch (Bediener oder Controller) durch den Erwerb der Konnektivität vom Soundin..."
        status: open
      - id: AC-SOUND-011-4
        text: "Wenn Stationen Scanning Sounding betreiben und für Anrufe empfänglich sind oder Kontakt erforderlich ist, sollte das ..."
        status: open
      - id: AC-SOUND-011-5
        text: "Die rufende Station sollte unverzüglich den Call initiieren, nachdem die gerufene Station ihre Übertragung beendet hat."
        status: open
      - id: AC-SOUND-011-6
        text: "Eine Wait-Before-Transmit Time ist für das Handshake nach Sounding nicht erforderlich."
