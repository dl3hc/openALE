      - id: AC-GEN-019-1
        text: "Alle aufgeführten Parameter müssen durch den Operator oder externen Controller programmierbar sein."
        status: open
  - id: REQ-GEN-020
    title: "Nachrichtenspeicher: Mindestens 12 Nachrichten / 1000 Zeichen, 1 Stunde Pufferung"
    spec: "A.4.3.5"
    priority: MUST
    status: offen
    ac:
      - id: AC-GEN-020-1
        text: "Das System muss mindestens 12 Nachrichten speichern können."
        status: open
      - id: AC-GEN-020-2
        text: "Die Gesamtkapazität muss mindestens 1000 Zeichen betragen."
        status: open
      - id: AC-GEN-020-3
        text: "Der Nachrichtenspeicher muss bei Stromausfall mindestens 1 Stunde lang erhalten bleiben."
        status: open
  - id: REQ-GEN-021
    title: "ALE-Betriebsregeln gemäß Tabelle A-V (Prioritätsreihenfolge)"
    spec: "A.4.4, Tabelle A-V"
    priority: MUST
    status: offen
    ac:
      - id: AC-GEN-021-1
        text: "Das System muss eine unabhängige ALE-Empfangsfähigkeit parallel zu anderen Modems bereitstellen."
        status: open
      - id: AC-GEN-021-2
        text: "Das System muss immer auf ALE-Signale hören (soweit physikalisch möglich)."
        status: open
      - id: AC-GEN-021-3
        text: "Das System muss immer antworten, sofern nicht explizit unterdrückt."
        status: open
      - id: AC-GEN-021-4
        text: "Das System muss immer scannen, wenn es nicht anderweitig genutzt wird."
        status: open
      - id: AC-GEN-021-5
        text: "Das System darf aktiven Kanal mit erkennbarem Datenverkehr (gemäß Tabelle A-I) nicht stören."
        status: open
      - id: AC-GEN-021-6
        text: "Das System muss LQA immer austauschen und die Signalqualität anderer immer messen."
        status: open
      - id: AC-GEN-021-7
        text: "Das System muss im richtigen Zeitschlitz auf Rufe mit Schlitz-Antwort-Anforderung antworten."
        status: open
      - id: AC-GEN-021-8
        text: "Das System muss die eigene Konnektivität zu anderen Stationen suchen und verfolgen."
        status: open
      - id: AC-GEN-021-9
        text: "Verlinkende Stationen müssen die höchste beidseitig unterstützte Fähigkeitsebene einsetzen."
        status: open
      - id: AC-GEN-021-10
        text: "Das System muss Sende- und Empfangszeit auf dem Kanal minimieren."
        status: open
      - id: AC-GEN-021-11
        text: "Das System muss die verwendete Sendeleistung automatisch minimieren, sofern es dazu in der Lage ist."
        status: open
  - id: REQ-GEN-022
    title: "AQC-ALE: Einführung und Grundprinzip (NT)"
    spec: "A.4.5.1"
    priority: COULD
    status: offen
    ac:
      - id: AC-GEN-022-1
        text: "Das AQC-ALE-System muss immer auf Basis-ALE-Rufe hören."
        status: open
      - id: AC-GEN-022-2
        text: "Das AQC-ALE-System muss automatisch im Basis-ALE-Modus antworten, wenn es per Basis-ALE gerufen wird."
        status: open
  - id: REQ-GEN-023
    title: "AQC-ALE: Allgemeine Signalisierungsstrategien"
    spec: "A.4.5.2"
    priority: COULD
    status: offen
    ac:
      - id: AC-GEN-023-1
        text: "Das Format muss drei Adresszeichen in 16 Bit packen."
        status: open
      - id: AC-GEN-023-2
        text: "Adressen dürfen maximal 6 Zeichen haben."
        status: open
      - id: AC-GEN-023-3
        text: "Pro Transaktion müssen sechs Adresszeichen gesendet werden."
        status: open
      - id: AC-GEN-023-4
        text: "FROM-Präambel muss durch PART2 ersetzt werden, THRU-Präambel durch INLINK."
        status: open
      - id: AC-GEN-023-5
        text: "Adressierungs- und Nachrichtenpräambeln müssen voneinander getrennt sein."
        status: open
      - id: AC-GEN-023-6
        text: "AQC-ALE-Adressen dürfen keine gültigen Basis-ALE-Adressen sein."
        status: open
      - id: AC-GEN-023-7
        text: "Mindestens 8 Informationsbits müssen pro Übertragung bereitgestellt werden."
        status: open
  - id: REQ-GEN-024
    title: "AQC-ALE: Unterstützte Funktionen"
    spec: "A.4.5.3"
    priority: COULD
    status: offen
    ac:
      - id: AC-GEN-024-1
        text: "Das AQC-ALE muss LP-Level 0, 1, 2 und 3 unterstützen."
        status: open
      - id: AC-GEN-024-2
        text: "Das AQC-ALE muss Einzelrufe, Star-Net-Rufe, AllCalls und AnyCalls unterstützen."
        status: open
      - id: AC-GEN-024-3
        text: "Das AQC-ALE muss LQA-Austausch als Teil des Ruf-Handshakes unterstützen."
        status: open
      - id: AC-GEN-024-4
        text: "Das AQC-ALE muss Orderwire (AMD, DTM, DBM) und Relay-Funktionen während eines Links unterstützen."
        status: open
      - id: AC-GEN-024-5
        text: "Soundings im AQC-ALE müssen auf Scan-Zeit + 50 % verkürzt sein."
        status: open
  - id: REQ-GEN-025
    title: "AQC-ALE: Nicht unterstützte Funktionen"
    spec: "A.4.5.4"
    priority: COULD
    us: US-WAVEFORM-001
    status: offen
    ac:
      - id: AC-GEN-025-1
        text: "Das AQC-ALE darf keinen Gruppenruf bereitstellen (Alternative: sequenzielles Hinzufügen über Rufprotokoll)."
        status: open
      - id: AC-GEN-025-2
        text: "AMD, DTM und DBM dürfen im AQC-ALE nicht während des Linkaufbaus verwendet werden."
        status: open
      - id: AC-GEN-025-3
        text: "Orderwire-Nachrichten sind während des AQC-ALE-Linkaufbaus nicht zulässig."
        status: open

  # --- WAVEFORM ---
  - id: REQ-WAVEFORM-001
    title: "Modulzweck des ALE-Waveform"
    spec: "A.5.1.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-WAVEFORM-001-1
        text: "Die Waveform muss durch das Audiopassband von Standard-SSB-Funkgeräten hindurchgeleitet werden können"
        status: open
      - id: AC-WAVEFORM-001-2
        text: "Die Waveform muss selektives Rufen ermöglichen"
        status: open
      - id: AC-WAVEFORM-001-3
        text: "Die Waveform muss Datenübertragung ermöglichen"
        status: open
  - id: REQ-WAVEFORM-002
    title: "Modulationsart"
    spec: "A.5.1.2"
    priority: MUST
    status: offen
    ac:
      - id: AC-WAVEFORM-002-1
        text: "Die Modulation muss FSK mit exakt 8 orthogonalen Tönen sein"
        status: open
      - id: AC-WAVEFORM-002-2
        text: "Pro Ton müssen exakt 3 Bits repräsentiert werden"
        status: open
      - id: AC-WAVEFORM-002-3
        text: "Es muss immer nur ein Ton zu einer Zeit übertragen werden"
        status: open
  - id: REQ-WAVEFORM-003
    title: "Tonfrequenzen und Bit-Zuordnung"
    spec: "A.5.1.2"
    priority: MUST
    status: offen
    ac:
      - id: AC-WAVEFORM-003-1
        text: "Jede Frequenz muss exakt das zugewiesene 3-Bit-Muster repräsentieren"
        status: open
  - id: REQ-WAVEFORM-004
    title: "Codierung und Interleaving der Bits"
    spec: "A.5.1.2, Bezug auf A.5.2.2 und A.5.2.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-WAVEFORM-004-1
        text: "Die Bits müssen codiert und interleaved sein gemäß den in A.5.2.2 und A.5.2.3 definierten Verfahren (siehe OPEN-01, O..."
        status: open
      - id: AC-WAVEFORM-004-2
        text: "Jede Gruppe von Bits muss einem vollständigen ALE-Wort entsprechen."
        status: open
  - id: REQ-WAVEFORM-005
    title: "Phasenkontinuität der Tonübergänge"
    spec: "A.5.1.2"
    priority: MUST
    status: offen
    ac:
      - id: AC-WAVEFORM-005-1
        text: "Tonübergänge müssen phasenkontinuierlich sein"
        status: open
      - id: AC-WAVEFORM-005-2
        text: "Tonübergänge müssen an einem Punkt mit null Ableitung (Maxima oder Minima) erfolgen"
        status: open
  - id: REQ-WAVEFORM-006
    title: "Tonrate und Symbolperiode"
    spec: "A.5.1.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-WAVEFORM-006-1
        text: "Die Tonrate muss exakt 125 Symbole/Sekunde sein"
        status: open
      - id: AC-WAVEFORM-006-2
        text: "Die Periode pro Ton muss exakt 8 ms sein"
        status: open
  - id: REQ-WAVEFORM-007
    title: "Übertragene Bitrate"
    spec: "A.5.1.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-WAVEFORM-007-1
        text: "Die übertragene Bitrate muss exakt 375 b/s sein"
        status: open
  - id: REQ-WAVEFORM-008
    title: "Wortgrenzen und redundante Wörter"
    spec: "A.5.1.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-WAVEFORM-008-1
        text: "Wortübergänge müssen mit Tonübergängen synchronisiert sein"
        status: open
      - id: AC-WAVEFORM-008-2
        text: "Es müssen exakt 49 Symbole pro redundantem Wort sein"
        status: open
  - id: REQ-WAVEFORM-009
    title: "Einzelwortperiode (Tw)"
    spec: "A.5.1.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-WAVEFORM-009-1
        text: "Tw muss 130,66... ms betragen"
        status: open
      - id: AC-WAVEFORM-009-2
        text: "Tw muss 16,33... Symbolen entsprechen"
        status: open
  - id: REQ-WAVEFORM-010
    title: "Verdreifachte-Wort-Periode (3×Tw)"
    spec: "A.5.1.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-WAVEFORM-010-1
        text: "3×Tw muss exakt 392 ms betragen"
        status: open
  - id: REQ-WAVEFORM-011
    title: "Tonfrequenzgenauigkeit am Baseband"
    spec: "A.5.1.4"
    priority: MUST
    status: offen
    ac:
      - id: AC-WAVEFORM-011-1
        text: "Jeder erzeugte Ton muss innerhalb von ±1,0 Hz seines Sollwerts liegen"
        status: open
  - id: REQ-WAVEFORM-012
    title: "Sendeleistung der Töne im HF-Bereich"
    spec: "A.5.1.4"
    priority: MUST
    status: offen
    ac:
      - id: AC-WAVEFORM-012-1
        text: "Alle übertragenen Töne müssen innerhalb von 2,0 dB Amplitude im HF-Bereich sein"
        status: open
  - id: REQ-WAVEFORM-013
    title: "Symbol-Timing-Genauigkeit"
    spec: "A.5.1.4"
    priority: MUST
    us: US-WORD-001
    status: offen
    ac:
      - id: AC-WAVEFORM-013-1
        text: "Symbol-Timing muss innerhalb von 10 ppm sein"
        status: open
      - id: AC-WAVEFORM-013-2
        text: "Bit-Rate muss innerhalb von 10 ppm sein"
        status: open
      - id: AC-WAVEFORM-013-3
        text: "Wort-Rate muss innerhalb von 10 ppm sein"
        status: open

  # --- WORD ---
  - id: REQ-WORD-001
    title: "Grundstruktur des ALE-Worts"
    spec: "A.5.2.3.1 / Figure A-12"
    priority: MUST
    status: offen
    ac:
      - id: AC-WORD-001-1
        text: "Ein grundlegendes ALE-Wort enthält genau 24 Bit."
        status: open
      - id: AC-WORD-001-2
        text: "Das Wort ist in genau einen 3-Bit-Präambelteil und einen 21-Bit-Datenfeldteil unterteilt."
        status: open
      - id: AC-WORD-001-3
        text: "Das höchstwertige Bit wird zuerst übertragen."
        status: open
      - id: AC-WORD-001-4
        text: "Vor der Übertragung wird das Wort in zwei 12-Bit-Hälften für die FEC-Kodierung aufgeteilt."
        status: open
      - id: AC-WORD-001-5
        text: "Das Datenfeld kann drei 7-Bit-ASCII-Zeichen pro Wort enthalten."
        status: open
  - id: REQ-WORD-002
    title: "Präambelbits und Worttypen"
    spec: "A.5.2.3.1.2 / A.5.2.3.1.3 / Table A-VIII"
    priority: MUST
    status: offen
    ac:
      - id: AC-WORD-002-1
        text: "Die führenden drei Bits eines ALE-Worts identifizieren genau einen von acht Worttypen."
        status: open
      - id: AC-WORD-002-2
        text: "Die Präambelbits werden als P3, P2 und P1 geführt."
        status: open
      - id: AC-WORD-002-3
        text: "Die Worttypen THRU, TO, CMD, FROM, TIS, TWAS, DATA und REP werden gemäß Standard unterstützt."
        status: open
      - id: AC-WORD-002-4
        text: "Optional definierte AQC-ALE-Preambles werden nur gemäß der dafür vorgesehenen Spezifikation verwendet."
        status: open
  - id: REQ-WORD-003
    title: "TO für direkte Zieladressen"
    spec: "A.5.2.3.2.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-WORD-003-1
        text: "TO wird für Einzelrufe und Netrufe gemäß Standard verwendet."
        status: open
      - id: AC-WORD-003-2
        text: "Ein TO-Wort enthält die ersten drei Zeichen der Adresse."
        status: open
      - id: AC-WORD-003-3
        text: "Erweiterte Adressen werden unmittelbar durch abwechselnde DATA- und REP-Wörter fortgesetzt."
        status: open
      - id: AC-WORD-003-4
        text: "Die zulässige Adressfolge endet spätestens bei fünf Adresswörtern beziehungsweise 15 Zeichen."
        status: open
  - id: REQ-WORD-004
    title: "TIS für die sendende Station und den Abschluss"
    spec: "A.5.2.3.2.2"
    priority: MUST
    status: offen
    ac:
      - id: AC-WORD-004-1
        text: "TIS kennzeichnet die aktuell sendende Station."
        status: open
      - id: AC-WORD-004-2
        text: "TIS wird zur Beendigung des ALE-Frames und der Übertragung verwendet, außer wenn TWAS verwendet wird."
        status: open
      - id: AC-WORD-004-3
        text: "TIS kann Antworten oder Bestätigungen anfordern, veranlassen oder einladen."
        status: open
      - id: AC-WORD-004-4
        text: "TIS kennzeichnet den Call-Acceptance-Sound."
        status: open
      - id: AC-WORD-004-5
        text: "Ein TIS-Wort enthält die ersten drei Zeichen der Adresse der rufenden Station."
        status: open
      - id: AC-WORD-004-6
        text: "Erweiterte Adressen folgen unmittelbar in abwechselnden DATA- und REP-Wörtern."
        status: open
      - id: AC-WORD-004-7
        text: "Die gesamte Adresse wird nur im Schlussabschnitt des ALE-Frames verwendet oder bildet ein vollständiges Sound."
        status: open
      - id: AC-WORD-004-8
        text: "TIS und TWAS werden nicht im selben Frame verwendet."
        status: open
  - id: REQ-WORD-005
    title: "TWAS für die beendende Station"
    spec: "A.5.2.3.2.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-WORD-005-1
        text: "TWAS kennzeichnet die Beendigung des ALE-Protokolls oder Handshakes."
        status: open
      - id: AC-WORD-005-2
        text: "TWAS weist Antworten oder Bestätigungen zurück, hemmt sie oder lädt sie nicht ein."
        status: open
      - id: AC-WORD-005-3
        text: "TWAS kennzeichnet den Call-Rejection-Sound."
        status: open
      - id: AC-WORD-005-4
        text: "TIS und TWAS werden nicht im selben Frame verwendet."
        status: open
  - id: REQ-WORD-006
    title: "THRU für Gruppenrufe im Scanning Call"
    spec: "A.5.2.3.2.4"
    priority: MUST
    status: offen
    ac:
      - id: AC-WORD-006-1
        text: "THRU wird nur im Scanning Call von Gruppenrufprotokollen verwendet."
        status: open
      - id: AC-WORD-006-2
        text: "THRU und REP alternieren in der vorgegebenen Sequenz."
        status: open
      - id: AC-WORD-006-3
        text: "Jedes mit THRU referenzierte erste Adresswort ist auf drei Zeichen begrenzt."
        status: open
      - id: AC-WORD-006-4
        text: "Ein Gruppenruf enthält höchstens fünf verschiedene erste Adresswörter."
        status: open
      - id: AC-WORD-006-5
        text: "THRU wird nicht für erweiterte Adressen verwendet."
        status: open
      - id: AC-WORD-006-6
        text: "Im Leading Call eines Gruppenrufs werden vollständige Adressen mit TO verwendet."
        status: open
      - id: AC-WORD-006-7
        text: "Stationskonforme Systeme ignorieren Calls, die ihre Adresse in einem THRU-Wort außerhalb des Scanning Calls verwenden."
        status: open
      - id: AC-WORD-006-8
        text: "Der THRU-Präambelwert ist für zukünftige indirekte und Relais-Protokolle reserviert."
        status: open
      - id: AC-WORD-006-9
        text: "Der THRU-Präambelwert ist auch für AQC-ALE reserviert."
        status: open
  - id: REQ-WORD-007
    title: "FROM als optionale Kennung der sendenden Station"
    spec: "A.5.2.3.2.5"
    priority: SHOULD
    status: offen
    ac:
      - id: AC-WORD-007-1
        text: "FROM identifiziert die sendende Station ohne Verwendung einer Frame-Beendigung wie TIS oder TWAS."
        status: open
      - id: AC-WORD-007-2
        text: "FROM enthält die vollständige Adresse der sendenden Station."
        status: open
      - id: AC-WORD-007-3
        text: "Falls erforderlich, werden für eine erweiterte FROM-Adresse DATA- und REP-Wörter verwendet."
        status: open
      - id: AC-WORD-007-4
        text: "FROM erscheint höchstens einmal pro ALE-Frame."
        status: open
      - id: AC-WORD-007-5
        text: "FROM erscheint nur unmittelbar vor CMD im Message-Abschnitt."
        status: open
      - id: AC-WORD-007-6
        text: "FROM kann zur schnellen Identifikation bei verzögerter normaler Schlusssequenz verwendet werden."
        status: open
      - id: AC-WORD-007-7
        text: "Stationskonforme Systeme ignorieren Abschnitte von Calls, die FROM-Wörter in anderer als der unmittelbar vor CMD steh..."
        status: open
      - id: AC-WORD-007-8
        text: "Der FROM-Präambelwert ist für zukünftige indirekte und Relais-Protokolle reserviert."
        status: open
      - id: AC-WORD-007-9
        text: "Der FROM-Präambelwert ist auch für AQC-ALE reserviert."
        status: open
  - id: REQ-WORD-008
    title: "CMD als Sonder-Designator für Message-Wörter"
    spec: "A.5.2.3.3 / A.5.2.3.3.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-WORD-008-1
        text: "Jeder Message-Wort-Abschnitt beginnt mit CMD."
        status: open
      - id: AC-WORD-008-2
        text: "CMD unterstützt die im Standard genannten systemweiten Sonderzwecke."
        status: open
      - id: AC-WORD-008-3
        text: "CMD wird nur im Message-Abschnitt verwendet."
        status: open
      - id: AC-WORD-008-4
        text: "Ein CMD im Frame hat einen vorausgehenden Ruf und eine nachfolgende Schlusssequenz."
        status: open
      - id: AC-WORD-008-5
        text: "Das erste CMD beendet den Calling Cycle und markiert den Beginn des Message-Abschnitts."
        status: open
      - id: AC-WORD-008-6
        text: "Orderwire-Funktionen können über CMD allein oder in Kombination mit REP und DATA ausgelöst werden."
        status: open
  - id: REQ-WORD-009
    title: "DATA als Erweiterungs- und Informationswort"
    spec: "A.5.2.3.4.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-WORD-009-1
        text: "DATA erweitert ein vorheriges Wortfeld, sofern das vorherige Wort nicht DATA ist."
        status: open
      - id: AC-WORD-009-2
        text: "DATA kann Informationen in einer Nachricht transportieren."
        status: open
      - id: AC-WORD-009-3
        text: "Mit TO, FROM, TIS oder TWAS erweitert DATA Adressen in Vielfachen von drei Zeichen."
        status: open
      - id: AC-WORD-009-4
        text: "Die Adresserweiterung endet spätestens bei 15 Zeichen."
        status: open
      - id: AC-WORD-009-5
        text: "Mit CMD gilt die standarddefinierte Funktion für Message-Wörter."
        status: open
  - id: REQ-WORD-010
    title: "REP als Wiederholungs- und Erweiterungswort"
    spec: "A.5.2.3.4.2"
    priority: MUST
    us: US-FEC-001
    status: offen
    ac:
      - id: AC-WORD-010-1
        text: "REP dupliziert die vorherige Präambelfunktion oder Wortbedeutung bei verändertem Datenfeldinhalt."
        status: open
      - id: AC-WORD-010-2
        text: "Jede Änderung von Wort oder Datenfeldbit erfordert eine Änderung der Präambel."
        status: open
      - id: AC-WORD-010-3
        text: "Ein Wortwechsel wird auch dann durch eine geänderte Präambel angezeigt, wenn das Datenfeld unverändert bleibt."
        status: open
      - id: AC-WORD-010-4
        text: "REP ermöglicht in Verbindung mit TO die Spezifikation mehrerer Adressen."
        status: open
      - id: AC-WORD-010-5
        text: "REP darf zur Erweiterung von Adress-, Nachrichten-, Befehls- und Statusfeldern verwendet werden."
        status: open
      - id: AC-WORD-010-6
        text: "REP folgt nicht auf sich selbst sowie nicht auf TIS oder TWAS."
        status: open
      - id: AC-WORD-010-7
        text: "REP darf nur dort eingesetzt werden, wo keine Mehrfachsender-Situation entsteht."
        status: open

  # --- FEC ---
  - id: REQ-FEC-004
    title: "Kombinierte Fehlerbehandlungs-Funktionen"
    spec: "A.5.2.2.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-004-1
        text: "Der Sendencoder muss FEC, Interleaving und Redundanz unterstützen"
        status: open
      - id: AC-FEC-004-2
        text: "Der Empfangsdecoder muss FEC, Deinterleaving und Redundanzverarbeitung unterstützen"
        status: open
  - id: REQ-FEC-005
    title: "FEC-Code-Typ"
    spec: "A.5.2.2.2"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-005-1
        text: "Der verwendete FEC-Code muss extended Golay (24, 12, 3) sein"
        status: open
      - id: AC-FEC-005-2
        text: "Jeder codierte Block muss 24 Bits umfassen, wovon 12 Datenbits und 12 Paritybits bestehen"
        status: open
      - id: AC-FEC-005-3
        text: "Der minimale Hamming-Abstand des Codes muss 3 betragen"
        status: open
  - id: REQ-FEC-006
    title: "FEC-Generator-Polynom"
    spec: "A.5.2.2.2"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-006-1
        text: "Das Generator-Polynom muss dem im Standard definierten Wert entsprechen"
        status: open
  - id: REQ-FEC-007
    title: "Generator-Matrix-Struktur"
    spec: "A.5.2.2.2, Figure A-6"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-007-1
        text: "Die Codewortstruktur muss der im Standard definierten systematischen Form des Golay (24,12)-Codes entsprechen."
        status: open
  - id: REQ-FEC-008
    title: "Parity-Check-Matrix-Struktur"
    spec: "A.5.2.2.2, Figure A-7"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-008-1
        text: "Das Fehlerprüfverfahren muss dem im Standard definierten Golay-Prüfverfahren entsprechen."
        status: open
  - id: REQ-FEC-009
    title: "Kodier-Formel"
    spec: "A.5.2.2.2.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-009-1
        text: "Jedes 12-Bit-Datenwort muss in ein 24-Bit-Golay-Codewort kodiert werden."
        status: open
      - id: AC-FEC-009-2
        text: "Das Codewort muss dem vom Standard definierten Kodierverfahren entsprechen."
        status: open
  - id: REQ-FEC-010
    title: "Dekodier-Formel und Syndrom-Bildung"
    spec: "A.5.2.2.2.2"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-010-1
        text: "Das Dekodierverfahren muss dem vom Standard vorgeschriebenen Syndrom-basierten Golay-Dekodierverfahren entsprechen."
        status: open
      - id: AC-FEC-010-2
        text: "Jeder korrigierbare Fehlervektor muss eindeutig einem Syndromwert zugeordnet sein."
        status: open
      - id: AC-FEC-010-3
        text: "Das dekodierte 12-Bit-Datenwort muss dem gesendeten Original entsprechen, sofern die Fehleranzahl die Korrekturkapazi..."
        status: open
  - id: REQ-FEC-011
    title: "Fehler-Korrektur-Flag-Logik"
    spec: "A.5.2.2.2.2"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-011-1
        text: "Ein Flag muss bei erfolgreicher Korrektur gesetzt werden"
        status: open
      - id: AC-FEC-011-2
        text: "Ein Flag muss bei einem nicht korrigierbaren, aber erkennbaren Fehler gesetzt werden"
        status: open
  - id: REQ-FEC-012
    title: "Interleaving-Vorgabe"
    spec: "A.5.2.2.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-012-1
        text: "Die Bits W1 bis W24 müssen gemäß dem Standard-Interleaving-Muster umgeordnet werden"
        status: open
      - id: AC-FEC-012-2
        text: "Die Golay FEC-Bits G13 bis G24 müssen vor dem Interleaving invertiert werden"
        status: open
      - id: AC-FEC-012-3
        text: "Das Deinterleaving am Empfänger muss umkehrbar und verlustfrei sein"
        status: open
  - id: REQ-FEC-013
    title: "Transmitted-Word-Struktur"
    spec: "A.5.2.2.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-013-1
        text: "Ein übertragenes Wort muss aus 48 Nutzbits und einem Stuff-Bit bestehen"
        status: open
      - id: AC-FEC-013-2
        text: "Das Stuff-Bit S₄₉ muss den Wert 0 haben"
        status: open
      - id: AC-FEC-013-3
        text: "Die Übertragungssequenz muss dem Muster A₁, B₁, A₂, B₂, ..., A₂₄, B₂₄, S₄₉ entsprechen"
        status: open
      - id: AC-FEC-013-4
        text: "Das empfangene 49te Stuff-Bit muss ignoriert werden"
        status: open
  - id: REQ-FEC-014
    title: "Redundanz-Übertragung"
    spec: "A.5.2.2.4"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-014-1
        text: "Jedes Wort muss exakt dreimal übertragen werden"
        status: open
      - id: AC-FEC-014-2
        text: "Die redundante Übertragung muss dazu dienen, Fading, Interferenz und Rauschen zu reduzieren"
        status: open
  - id: REQ-FEC-015
    title: "Scanning-Call Redundanz-Dauer"
    spec: "A.5.2.2.4"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-015-1
        text: "Ein Scanning-Call-Wort muss solange wiederholt werden, bis der Empfang sichergestellt ist"
        status: open
      - id: AC-FEC-015-2
        text: "Die Wiederholungsdauer muss dem im Scanning-Call definierten Zeitrahmen entsprechen"
        status: open
  - id: REQ-FEC-016
    title: "Group-Call Redundanz-Sequenz"
    spec: "A.5.2.2.4"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-016-1
        text: "Das erste Routing-Wort im Group-Call muss THRU sein und dreimal wiederholt werden"
        status: open
      - id: AC-FEC-016-2
        text: "Alle nachfolgenden Routing-Wörter müssen REP und THRU alternierend und jeweils dreimal wiederholt werden"
        status: open
      - id: AC-FEC-016-3
        text: "Die Triple-Wörter müssen in Gruppen-Sequenz rotiert werden"
        status: open
  - id: REQ-FEC-017
    title: "2/3 Mehrheits-Entscheidung"
    spec: "A.5.2.2.4"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-017-1
        text: "Eine 2/3-Mehrheitsentscheidung muss auf Bit-Basis über drei Wörter durchgeführt werden"
        status: open
      - id: AC-FEC-017-2
        text: "Die Entscheidung muss sowohl das aktuelle Bit als auch die vergangenen Bits berücksichtigen"
        status: open
  - id: REQ-FEC-018
    title: "Majority-Wort-Weitergabe"
    spec: "A.5.2.2.4"
    priority: MUST
    status: offen
    ac:
      - id: AC-FEC-018-1
        text: "Das Majority-Wort muss exakt 48 Bits umfassen"
        status: open
      - id: AC-FEC-018-2
        text: "Das Majority-Wort muss an den Deinterleaver übergeben werden"
        status: open
      - id: AC-FEC-018-3
        text: "Das Majority-Wort muss an den FEC-Decoder übergeben werden"
        status: open
  - id: REQ-FEC-019
    title: "Unanimous-Votes-Erfassung"
    spec: "A.5.2.2.4"
    priority: MUST
    us: US-FRAME-001
    status: offen
    ac:
      - id: AC-FEC-019-1
        text: "Die Anzahl der einstimmigen Stimmen muss für die 48 Bits erfasst werden"
        status: open
      - id: AC-FEC-019-2
        text: "Die erfassten Werte müssen temporär gespeichert werden"
        status: open

  # --- FRAME ---
  - id: REQ-FRAME-001
    title: "Frame-Grundstruktur und Wortbasis"
    spec: "A.5.2.5"
    priority: MUST
    status: offen
    ac:
      - id: AC-FRAME-001-1
        text: "Jede ALE-Aussendung verwendet ausschließlich Töne, Timing sowie Bit- und Wortstrukturen gemäß A.5.1 und A.5.2.3."
        status: open
      - id: AC-FRAME-001-2
        text: "Jeder Frame besteht ausschließlich aus fortlaufenden redundanten Wörtern in gültigen Sequenzen."
        status: open
      - id: AC-FRAME-001-3
        text: "Jeder Frame enthält die drei Abschnitte Calling Cycle, Message und Conclusion in genau dieser Reihenfolge (wobei Mess..."
        status: open
      - id: AC-FRAME-001-4
        text: "Die Konstruktion eines Frames entspricht den Vorgaben aus Figure A-14, Table A-VII und den Format-Beschreibungen aus ..."
        status: open
  - id: REQ-FRAME-002
    title: "Calling Cycle: Gliederung und Bestandteile"
    spec: "A.5.2.5.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-FRAME-002-1
        text: "Jeder Frame (außer Sounds) beginnt mit einem Calling Cycle."
        status: open
      - id: AC-FRAME-002-2
        text: "Der Calling Cycle besteht aus genau zwei Teilen: Scanning Call und Leading Call."
        status: open
      - id: AC-FRAME-002-3
        text: "Der Calling Cycle endet mit dem Beginn des Message- oder, bei fehlendem Message-Abschnitt, des Conclusion-Abschnitts."
        status: open
  - id: REQ-FRAME-003
    title: "Scanning Call: Zusammensetzung und Adressinhalt"
    spec: "A.5.2.5.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-FRAME-003-1
        text: "Bei Individual- und Net-Calls enthält der Scanning Call ausschließlich TO-Wörter mit dem ersten Adresswort der gerufe..."
        status: open
      - id: AC-FRAME-003-2
        text: "Bei Group Calls enthält der Scanning Call abwechselnd THRU- und REP-Wörter."
        status: open
      - id: AC-FRAME-003-3
        text: "Der Scanning Call enthält in beiden Fällen nur das jeweils erste Wort der Zieladresse, keine vollständige Adresse."
        status: open
      - id: AC-FRAME-003-4
        text: "Der Satz der Adress-Erstworte (Tcl) wird so oft wiederholt, bis die Suchlaufperiode (Ts) überschritten wird."
        status: open
      - id: AC-FRAME-003-5
        text: "Die Dauer des Scanning Call (Tsc) ist ≥ Ts."
        status: open
  - id: REQ-FRAME-004
    title: "Leading Call: Zusammensetzung und Adressinhalt"
    spec: "A.5.2.5.1 / Figure A-15"
    priority: MUST
    status: offen
    ac:
      - id: AC-FRAME-004-1
        text: "Der Leading Call enthält die vollständige(n) Zieladresse(n) einschließlich aller Erweiterungswörter (DATA, REP)."
        status: open
      - id: AC-FRAME-004-2
        text: "Der Leading Call beginnt mit dem Einleitungszeitpunkt des Leading Call und endet spätestens mit dem Beginn des Messag..."
        status: open
      - id: AC-FRAME-004-3
        text: "Die Verwendung von DATA- und REP-Wörtern im Leading Call entspricht den Regeln aus A.5.2.4."
        status: open
  - id: REQ-FRAME-005
    title: "Frame-Synchronisation: Kein dediziertes Sync-Word"
    spec: "A.5.2.5.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-FRAME-005-1
        text: "Der Sender fügt kein dediziertes Flag- oder Sync-Wort zur Frame-Synchronisation ein."
        status: open
      - id: AC-FRAME-005-2
        text: "Eine Empfangsstation ist in der Lage, das ALE-Signal an einem beliebigen Punkt nach Übertragungsbeginn zu synchronisi..."
        status: open
  - id: REQ-FRAME-006
    title: "Sender-Hochlaufzeit: 90-Prozent-Leistung"
    spec: "A.5.2.5.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-FRAME-006-1
        text: "Die Sendeleistung beträgt spätestens 2,5 ms nach dem ersten ALE-Ton mindestens 90 % der gewählten HF-Leistung."
        status: open
      - id: AC-FRAME-006-2
        text: "Die zulässige 2,5-ms-Verzögerung ist additiv zur Attackzeit aus 5.3.5.1."
        status: open
      - id: AC-FRAME-006-3
        text: "Die Einhaltung gilt auch dann als erfüllt, wenn das Verlinkungswahrscheinlichkeitskriterium gemäß Table A-I erfüllt i..."
        status: open
  - id: REQ-FRAME-007
    title: "Quick-ID: Optionaler Transmitter-Identifier am Beginn des Message-Abschnitts"
    spec: "A.5.2.5.1 / A.5.2.5.2"
    priority: SHOULD
    status: offen
    ac:
      - id: AC-FRAME-007-1
        text: "Eine Quick-ID, sofern verwendet, steht ausschließlich an der ersten Position des Message-Abschnitts, nach dem Leading..."
        status: open
      - id: AC-FRAME-007-2
        text: "Die Quick-ID besteht aus FROM- und möglicherweise REP- und DATA-Wörtern mit der vollständigen Senderadresse."
        status: open
      - id: AC-FRAME-007-3
        text: "Die Quick-ID wird höchstens einmal pro Frame verwendet, am Beginn der CMD-Message-Sequenz."
        status: open
      - id: AC-FRAME-007-4
        text: "Eine Quick-ID wird niemals ohne mindestens eine nachfolgende CMD-Message gesendet."
        status: open
      - id: AC-FRAME-007-5
        text: "Wird keine Quick-ID verwendet, beginnt der Message-Abschnitt direkt mit dem ersten CMD-Wort."
        status: open
  - id: REQ-FRAME-008
    title: "Message-Abschnitt: Struktur und Zusammensetzung"
    spec: "A.5.2.5.2 / Figure A-16"
    priority: MUST
    status: offen
    ac:
      - id: AC-FRAME-008-1
        text: "Der Message-Abschnitt enthält — abgesehen von der optionalen Quick-ID — ausschließlich CMD-, REP- und DATA-Wörter."
        status: open
      - id: AC-FRAME-008-2
        text: "Der Message-Abschnitt beginnt immer mit dem ersten CMD-Wort oder, bei Quick-ID, mit dem FROM-Wort."
        status: open
      - id: AC-FRAME-008-3
        text: "Der Message-Abschnitt wird innerhalb eines Calls genau einmal gesendet (keine Wiederholung des gesamten Abschnitts)."
        status: open
      - id: AC-FRAME-008-4
        text: "Der Message-Abschnitt erstreckt sich vom Ende des Calling Cycle bis zum Beginn des Conclusion-Abschnitts."
        status: open
  - id: REQ-FRAME-009
    title: "Message-Abschnitt: AQC-ALE-Sonderregel"
    spec: "A.5.2.5.2 / A.5.8.2.3"
    priority: COULD
    status: offen
    ac:
      - id: AC-FRAME-009-1
        text: "Bei AQC-ALE steht der Message-Abschnitt nur im Link-Zustand zur Verfügung."
        status: open
      - id: AC-FRAME-009-2
        text: "Das Acknowledgement Leg (drittes Bein) eines Calls kann als Inlink-Entry-Bedingung verwendet werden."
        status: open
  - id: REQ-FRAME-010
    title: "Conclusion: Struktur und Worttypen"
    spec: "A.5.2.5.3 / Figure A-17"
    priority: MUST
    status: offen
    ac:
      - id: AC-FRAME-010-1
        text: "Die Conclusion enthält entweder ausschließlich TIS-Wörter oder ausschließlich TWAS-Wörter als Typ-Anker — niemals bei..."
        status: open
      - id: AC-FRAME-010-2
        text: "Die Conclusion kann zusätzlich DATA- und REP-Wörter enthalten."
        status: open
      - id: AC-FRAME-010-3
        text: "Die Conclusion enthält die vollständige Adresse der sendenden Station."
        status: open
      - id: AC-FRAME-010-4
        text: "Liegt kein Message-Abschnitt vor, beginnt die Conclusion unmittelbar nach dem Calling Cycle."
        status: open
      - id: AC-FRAME-010-5
        text: "Die Conclusion erstreckt sich bis zum Ende des Calls."
        status: open
  - id: REQ-FRAME-011
    title: "Conclusion bei Sounds und Ausnahme-Frames"
    spec: "A.5.2.5.3 / A.5.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-FRAME-011-1
        text: "Bei Sounds und Exception-Frames beginnt die Aussendung direkt mit TIS- oder TWAS-Wörtern."
        status: open
      - id: AC-FRAME-011-2
        text: "Ein REP-Wort folgt niemals unmittelbar auf ein TIS- oder TWAS-Wort."
        status: open
  - id: REQ-FRAME-012
    title: "Gültige Wortsequenzen im Frame"
    spec: "A.5.2.5.4 / Figure A-18 / Figure A-19 / Figure A-20"
    priority: MUST
    status: offen
    ac:
      - id: AC-FRAME-012-1
        text: "Jede gesendete Wortsequenz in einem Frame oder einer Message entspricht den erlaubten Sequenzen aus Figure A-18, Figu..."
        status: open
      - id: AC-FRAME-012-2
        text: "Jede empfangene Wortsequenz wird gegen die erlaubten Sequenzen validiert; unzulässige Sequenzen werden verworfen."
        status: open
  - id: REQ-FRAME-013
    title: "Frame-Größen- und Zeitgrenzen (Table A-XII)"
    spec: "A.5.2.5.4 / Table A-XII"
    priority: MUST
    us: US-SYNC-001
    status: offen
    ac:
      - id: AC-FRAME-013-1
        text: "Die Adressgröße überschreitet nicht 5 Wörter (Ta max = 1960 ms)."
        status: open
      - id: AC-FRAME-013-2
        text: "Die Call-Zeit (Tc, als halbe Tlc) überschreitet nicht 12 Wörter (4704 ms)."
        status: open
      - id: AC-FRAME-013-3
        text: "Die maximale Suchlaufperiode (Ts max) überschreitet nicht 50 s."
        status: open
      - id: AC-FRAME-013-4
        text: "Die Basiszeit des Message-Abschnitts (Tm max basic) überschreitet nicht 11,76 s, sofern keine AMD-Extension, DTM oder..."
        status: open
      - id: AC-FRAME-013-5
        text: "Bei Verwendung von AMD (90 Zeichen) überschreitet die Message-Zeit nicht 11,76 s."
        status: open
      - id: AC-FRAME-013-6
        text: "Bei Verwendung von DTM (1053 Zeichen) überschreitet die Message-Zeit nicht 2,29 min (gesamter Datenblock)."
        status: open
      - id: AC-FRAME-013-7
        text: "Bei Verwendung von DBM (37377 Zeichen) überschreitet die Message-Zeit nicht 23,26 min (gesamter tief-interleaved Block)."
        status: open

  # --- SYNC ---
  - id: REQ-SYNC-001
    title: "Asynchroner Systembetrieb und Frame-interne Word-Sync"
    spec: "A.5.2.6"
    priority: MUST
