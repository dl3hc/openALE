        status: open
      - id: AC-GEN-013-4
        text: "Nach dem Abruf darf der ursprüngliche gespeicherte Eintrag nicht verändert werden, auch wenn der abgerufene Eintrag m..."
        status: open
  - id: REQ-GEN-014
