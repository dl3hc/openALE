      - id: AC-SYNC-005-3
        text: "Der Empfangsdemodulator stellt die zurückgewonnenen digitalen Daten den Decodern bereit."
        status: open
      - id: AC-SYNC-005-4
        text: "Im DBM-Modus ist der Empfangsdemodulator in der Lage, einzelne Datenbits für das tiefe Deinterleaving und Dekodieren ..."
        status: open
  - id: REQ-SYNC-006
    title: "Synchronisationskriterien für jedes ALE-Wort"
    spec: "A.5.2.6.3"
    priority: MUST
    status: offen
    ac:
