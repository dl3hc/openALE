        status: open
  - id: REQ-LINK-038
    title: "Star Group Call Conclusion"
    spec: "A.5.5.4.3.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-LINK-038-1
        text: "Der Nachrichtenabschnitt ist optional."
        status: open
      - id: AC-LINK-038-2
        text: "Die Schlussfolge folgt A.5.2.5.3."
        status: open
      - id: AC-LINK-038-3
        text: "Die Vorgaben sind korrekt."
        status: open
  - id: REQ-LINK-039
    title: "Receiving a Star Group Call"
    spec: "A.5.5.4.3.4"
    priority: MUST
    status: offen
    ac:
      - id: AC-LINK-039-1
        text: "Slots werden abgeleitet."
        status: open
      - id: AC-LINK-039-2
        text: "Die Station liest THRU- oder REP-Preambles."
        status: open
      - id: AC-LINK-039-3
        text: "Die Station prüft auf Übereinstimmung."
        status: open
      - id: AC-LINK-039-4
        text: "Die Station kehrt in den verfügbaren Zustand zurück."
        status: open
      - id: AC-LINK-039-5
        text: "Tlc wird geprüft."
        status: open
      - id: AC-LINK-039-6
        text: "Der Slot-Zähler wird gesetzt und inkrementiert."
        status: open
      - id: AC-LINK-039-7
        text: "Die Nachrichtenabschnitt und Schlussfolge werden verarbeitet."
        status: open
      - id: AC-LINK-039-8
        text: "Bei spätem Eintreffen wird ein Standardwert verwendet."
        status: open
  - id: REQ-LINK-040
    title: "Star Group Slotted Responses"
    spec: "A.5.5.4.3.5"
    priority: MUST
    status: offen
    ac:
      - id: AC-LINK-040-1
        text: "Slotted Responses werden gemäß A.5.5.4.1 gesendet."
        status: open
      - id: AC-LINK-040-2
        text: "Slotted Responses werden überprüft."
        status: open
      - id: AC-LINK-040-3
        text: "Die abgeleiteten Slot-Nummern werden verwendet."
        status: open
      - id: AC-LINK-040-4
        text: "Die eigene Adresse wird verwendet."
        status: open
  - id: REQ-LINK-041
    title: "Star Group Acknowledgment"
    spec: "A.5.5.4.3.6"
    priority: MUST
    status: offen
    ac:
      - id: AC-LINK-041-1
        text: "Die Bestätigung ist an Subset gerichtet."
        status: open
      - id: AC-LINK-041-2
        text: "Die führende Aufruf-Adresse wird zweimal gesendet."
        status: open
      - id: AC-LINK-041-3
        text: "Die Bestätigung wird verarbeitet gemäß A.5.5.3.4."
        status: open
      - id: AC-LINK-041-4
        text: "Der Twan-Wert wird verwendet."
        status: open
      - id: AC-LINK-041-5
        text: "Selbstadressen werden durchsucht."
        status: open
      - id: AC-LINK-041-6
        text: "TWAS kehrt die Station in ihren vorherigen Zustand zurück."
        status: open
      - id: AC-LINK-041-7
        text: "TIS wechselt in den verknüpften Zustand."
        status: open
      - id: AC-LINK-041-8
        text: "Der Operator wird benachrichtigt."
        status: open
      - id: AC-LINK-041-9
        text: "Der Lautsprecher wird eingeschaltet."
        status: open
      - id: AC-LINK-041-10
        text: "Der Timer Twa wird gesetzt."
        status: open
  - id: REQ-LINK-042
    title: "Star Group Call Example"
    spec: "A.5.5.4.3.7"
    priority: MUST
    status: offen
    ac:
      - id: AC-LINK-042-1
        text: "Die Beispielgruppe ist in Abb. A-35 gezeigt."
        status: open
      - id: AC-LINK-042-2
        text: "Die Slot-Zeiten sind korrekt."
        status: open
      - id: AC-LINK-042-3
        text: "Die Bestätigung wird korrekt gesendet."
        status: open
  - id: REQ-LINK-043
    title: "Multiple Self Addresses in Group Call"
    spec: "A.5.5.4.3.8"
    priority: MUST
    status: offen
    ac:
      - id: AC-LINK-043-1
        text: "Eine Station antwortet auf mehrere Adressen."
        status: open
      - id: AC-LINK-043-2
        text: "Die Tatsache, dass die Station mehrere Adressen hat, ist dem Aufrufer nicht bekannt."
        status: open
      - id: AC-LINK-043-3
        text: "Konflikte können nach erfolgreicher Verknüpfung aufgelöst werden."
        status: open
  - id: REQ-LINK-044
    title: "AllCall Protocol"
    spec: "A.5.5.4.4"
    priority: MUST
    status: offen
    ac:
      - id: AC-LINK-044-1
        text: "Ein AllCall fordert Stationen auf, zu hören."
        status: open
      - id: AC-LINK-044-2
        text: "Ein AllCall fordert keine Antworten an."
        status: open
      - id: AC-LINK-044-3
        text: "Die AllCall-Adresse wird nur in TO-Wörtern verwendet."
        status: open
      - id: AC-LINK-044-4
        text: "Selektive AllCalls verwenden Gruppenadressierung."
        status: open
      - id: AC-LINK-044-5
        text: "Die Station wird identifiziert."
        status: open
      - id: AC-LINK-044-6
        text: "Die Pause wird gestartet."
        status: open
      - id: AC-LINK-044-7
        text: "Bei Quick-ID wird die Pause erweitert."
        status: open
      - id: AC-LINK-044-8
        text: "Bei Nachricht wird eine Zeit für das Lesen verwendet."
        status: open
      - id: AC-LINK-044-9
        text: "Bei Schlussfolge wird eine Zeit für das Lesen verwendet."
        status: open
      - id: AC-LINK-044-10
        text: "Bei TIS wird der Zustand gewechselt."
        status: open
      - id: AC-LINK-044-11
        text: "Bei TWAS kehrt die Station zum Scanning zurück."
        status: open
      - id: AC-LINK-044-12
        text: "Der Operator kann einen Handshake initiieren."
        status: open
      - id: AC-LINK-044-13
        text: "AllCall-Adresse wird nicht verwendet."
        status: open
      - id: AC-LINK-044-14
        text: "Controller können AllCalls ignorieren."
        status: open
      - id: AC-LINK-044-15
        text: "AllCall-Verarbeitung sollte aktiviert sein."
        status: open
  - id: REQ-LINK-045
    title: "AnyCall Protocol"
    spec: "A.5.5.4.5"
    priority: MUST
    status: offen
    ac:
      - id: AC-LINK-045-1
        text: "Ein AnyCall fordert Antworten an."
        status: open
      - id: AC-LINK-045-2
        text: "Die Verwendung der AnyCall-Adresse ist identisch mit AllCall."
        status: open
      - id: AC-LINK-045-3
        text: "Die Station prüft den Aufruf wie bei AllCall."
        status: open
      - id: AC-LINK-045-4
        text: "Bei TIS wird ein Link-Zustand gewechselt."
        status: open
      - id: AC-LINK-045-5
        text: "Die Station generiert eine slotted Antwort."
        status: open
      - id: AC-LINK-045-6
        text: "Die Station wählt zufällig eine Slot-Nummer."
        status: open
      - id: AC-LINK-045-7
        text: "Die Slot-Breite wird berechnet."
        status: open
      - id: AC-LINK-045-8
        text: "Slot 0 wird für das Tunen verwendet."
        status: open
      - id: AC-LINK-045-9
        text: "Die Antwort wird gesendet."
        status: open
      - id: AC-LINK-045-10
        text: "Kollisionen werden erwartet und toleriert."
        status: open
      - id: AC-LINK-045-11
        text: "Die aufrufende Station liest die beste Antwort."
        status: open
      - id: AC-LINK-045-12
        text: "Die aufrufende Station sendet eine ACK."
        status: open
      - id: AC-LINK-045-13
        text: "Die AnyCall-Adresse wird nicht verwendet."
        status: open
      - id: AC-LINK-045-14
        text: "Controller können AnyCalls ignorieren."
        status: open
      - id: AC-LINK-045-15
        text: "AnyCall-Verarbeitung sollte aktiviert sein."
        status: open
  - id: REQ-LINK-046
    title: "Wildcard Calling Protocol"
    spec: "A.5.5.4.6"
    priority: MUST
    us: US-ADDR-001
    status: offen
    ac:
      - id: AC-LINK-046-1
        text: "Wildcard-Adressen sind die einzigen Mitglieder des Aufrufs."
        status: open
      - id: AC-LINK-046-2
        text: "Wildcard-Adressen werden nicht in anderen Adressfeldern verwendet."
        status: open
      - id: AC-LINK-046-3
        text: "Der Umfang der Wildcards ist begrenzt."
        status: open
      - id: AC-LINK-046-4
        text: "Aufrufe mit TWAS werden wie AllCall verarbeitet."
        status: open
      - id: AC-LINK-046-5
        text: "Antworten mit TIS werden in pseudozufälligen Slots gesendet."
        status: open
      - id: AC-LINK-046-6
        text: "Die Verarbeitung kann ignoriert werden."
        status: open
      - id: AC-LINK-046-7
        text: "Wildcard-Aufruf-Verarbeitung sollte aktiviert sein."
        status: open

  # --- ADDR ---
  - id: REQ-ADDR-001
    title: "Digitale Adressstruktur und Speicherkapazität"
    spec: "A.5.2.4.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-001-1
        text: "Das System verwendet eine digitale Adressstruktur auf Basis des 24-Bit-Worts und des Basic-38-Zeichensatzes."
        status: open
      - id: AC-ADDR-001-2
        text: "Eine Station kann mit einer oder mehreren vorab vereinbarten oder bedarfsabhängigen Stationen verlinken oder vernetzen."
        status: open
      - id: AC-ADDR-001-3
        text: "Das System kann mindestens 20 eigene Adressen verwalten."
        status: open
      - id: AC-ADDR-001-4
        text: "Jede dieser eigenen Adressen kann bis zu 15 Zeichen lang sein."
        status: open
      - id: AC-ADDR-001-5
        text: "Das System unterstützt Einzelstation-, Mehrfachstation- und Sondermodi der Adressierung."
        status: open
      - id: AC-ADDR-001-6
        text: "Adresskombinationen mit Sonderbedeutung werden kontrolliert oder eingeschränkt behandelt."
        status: open
  - id: REQ-ADDR-002
    title: "Basic-38-Zeichensatz und gültige Basisadresse"
    spec: "A.5.2.4.2"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-002-1
        text: "Der Basic-38-ASCII-Zeichensatz umfasst A bis Z, 0 bis 9, „@“ und „?“."
        status: open
      - id: AC-ADDR-002-2
        text: "Der Basic-38-ASCII-Zeichensatz wird für alle grundlegenden Adressierungsfunktionen verwendet."
        status: open
      - id: AC-ADDR-002-3
        text: "Eine gültige Basisadresse enthält ein Routing-Präambelwort und drei Zeichen aus dem Basic-38-ASCII-Zeichensatz."
        status: open
      - id: AC-ADDR-002-4
        text: "Die Sonderzeichen „@“ und „?“ werden für spezielle Funktionen verwendet."
        status: open
      - id: AC-ADDR-002-5
        text: "Die Erkennung von Basic-38-Zeichen darf nicht allein auf den drei höchstwertigen Bits beruhen."
        status: open
  - id: REQ-ADDR-003
    title: "Stuffing nicht vollständiger Adressen"
    spec: "A.5.2.4.3"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-003-1
        text: "Nicht durch drei teilbare Adresslängen werden durch Auffüllen der nachlaufenden Positionen mit „@“ in standardisierte..."
        status: open
      - id: AC-ADDR-003-2
        text: "Stuff-1 und Stuff-2 werden nur im letzten Wort einer Adresse verwendet."
        status: open
      - id: AC-ADDR-003-3
        text: "Stuff-1 und Stuff-2 erscheinen nur im führenden Ruf des Calling Cycles."
        status: open
  - id: REQ-ADDR-004
    title: "Einzeladresse als grundlegendes Adresselement"
    spec: "A.5.2.4.4"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-004-1
        text: "Eine individuelle Stationsadresse basiert auf genau einem Routing-Wort mit drei Zeichen."
        status: open
      - id: AC-ADDR-004-2
        text: "Eine einer einzelnen Station zugeordnete Adresse wird als individuelle Adresse bezeichnet."
        status: open
      - id: AC-ADDR-004-3
        text: "Eine einwortige individuelle Adresse wird als Basisgröße bezeichnet."
        status: open
      - id: AC-ADDR-004-4
        text: "Eine mehr als ein Wort umfassende individuelle Adresse wird als erweiterte Größe bezeichnet."
        status: open
      - id: AC-ADDR-004-5
        text: "Das grundlegende Adresswort kann für Intranet- und Slotted-Betrieb verwendet werden."
        status: open
      - id: AC-ADDR-004-6
        text: "Das grundlegende Adresswort kann für Internet- und allgemeinen Gebrauch erweitert werden."
        status: open
  - id: REQ-ADDR-005
    title: "Standard-Adressmuster und Sonderruf-Varianten"
    spec: "Table A-IX / A.5.2.4.4"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-005-1
        text: "Nicht dargestellte Muster werden als reserviert und ungültig behandelt, bis sie standardisiert sind."
        status: open
      - id: AC-ADDR-005-2
        text: "„@“ wird als Utility-Zeichen behandelt."
        status: open
      - id: AC-ADDR-005-3
        text: "„?“ wird als Wildcard-Zeichen behandelt."
        status: open
      - id: AC-ADDR-005-4
        text: "A, B, C und D stehen nur für Zeichen aus dem Basic-38-ASCII-Zeichensatz, die weder „@“ noch „?“ sind."
        status: open
  - id: REQ-ADDR-006
    title: "Basisgröße der Einzeladresse"
    spec: "A.5.2.4.4.1"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-006-1
        text: "Eine Basisadresse besteht aus einem Routing-Präambelwort und drei Adresszeichen."
        status: open
      - id: AC-ADDR-006-2
        text: "Eine dreistellige Einzelwortadresse ist die minimale Struktur."
        status: open
      - id: AC-ADDR-006-3
        text: "Für die dreistellige individuelle Adresse ist eine Basic-38-Adresskapazität von 46.656 gegeben."
        status: open
      - id: AC-ADDR-006-4
        text: "Alle eigenen Adressen sind mit spezifischen Zeit- und Steuerinformationen verknüpft."
        status: open
      - id: AC-ADDR-006-5
        text: "Jede ALE-Station besitzt mindestens eine einwortige Adresse für einwortige Adressprotokolle."
        status: open
      - id: AC-ADDR-006-6
        text: "Längere Adressen werden durch das Design nicht ausgeschlossen."
        status: open
  - id: REQ-ADDR-007
    title: "Erweiterte Adresse bis fünf Wörter"
    spec: "A.5.2.4.4.2"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-007-1
        text: "Erweiterte Adressen können länger als ein Wort sein."
        status: open
      - id: AC-ADDR-007-2
        text: "Erweiterte Adressen überschreiten nicht fünf Wörter."
        status: open
      - id: AC-ADDR-007-3
        text: "Erweiterte Adressen überschreiten nicht 15 Zeichen."
        status: open
      - id: AC-ADDR-007-4
        text: "Eine erweiterte Adresse beginnt mit einem Basisadresswort wie TO oder TIS."
        status: open
      - id: AC-ADDR-007-5
        text: "Weitere Zeichen werden über zusätzliche Wörter in der Folge DATA, REP, DATA, REP aufgenommen."
        status: open
      - id: AC-ADDR-007-6
        text: "Alle Adresszeichen stammen aus dem Basic-38-ASCII-Zeichensatz."
        status: open
  - id: REQ-ADDR-008
    title: "Netzruf mit gemeinsamer Netadresse"
    spec: "A.5.2.4.5"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-008-1
        text: "Ein Netzruf verwendet eine einzige gemeinsam zugewiesene Netadresse."
        status: open
      - id: AC-ADDR-008-2
        text: "Die rufende Station verwendet eine Adressstruktur, die der individuellen Stationsadresse entspricht."
        status: open
      - id: AC-ADDR-008-3
        text: "Eine Netmitgliedsstation besitzt je Netadresse einen Response-Slot-Identifikator."
        status: open
      - id: AC-ADDR-008-4
        text: "Ein Slot-Width-Modifikator ist vorhanden, wenn das Standardprotokoll dies vorgibt."
        status: open
      - id: AC-ADDR-008-5
        text: "Zusätzliche Informationen zu zugewiesenen Response-Slots und deren Größe sind verfügbar."
        status: open
      - id: AC-ADDR-008-6
        text: "Das Mischen von individuellen, Netz- und Gruppenadressen sowie -rufen ist eingeschränkt."
        status: open
  - id: REQ-ADDR-009
    title: "Gruppenruf mit individuellen Zieladressen"
    spec: "A.5.2.4.6"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-009-1
        text: "Ein Gruppenruf verwendet mehrere nicht vorab vereinbarte Stationsadressen in einer kompakten Kombination."
        status: open
      - id: AC-ADDR-009-2
        text: "Die rufende Station verwendet die tatsächlichen individuellen Stationsadressen der gerufenen Stationen."
        status: open
      - id: AC-ADDR-009-3
        text: "Die Reihenfolge folgt dem spezifischen Standardprotokoll."
        status: open
      - id: AC-ADDR-009-4
        text: "Eine Stationsadresse erscheint in einer Gruppenruf-Folge nicht mehr als einmal, außer wenn das Gruppenrufprotokoll di..."
        status: open
  - id: REQ-ADDR-010
    title: "Globaler AllCall und selective AllCall"
    spec: "A.5.2.4.7"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-010-1
        text: "Ein AllCall fordert keine Antworten an."
        status: open
      - id: AC-ADDR-010-2
        text: "Ein AllCall bezeichnet keine spezifische Adresse."
        status: open
      - id: AC-ADDR-010-3
        text: "Die globale AllCall-Adresse ist „@?@“."
        status: open
      - id: AC-ADDR-010-4
        text: "Ein selective AllCall legt das letzte einzelne Zeichen der Zieladressen fest."
        status: open
      - id: AC-ADDR-010-5
        text: "Bei mehr als einer Teilmenge darf die selective-AllCall-Adressierung eine THRU/REP-Folge verwenden."
        status: open
      - id: AC-ADDR-010-6
        text: "Die ausgewählten Zeichen bestimmen, welche Stationen das Scannen beenden und zuhören."
        status: open
  - id: REQ-ADDR-011
    title: "Globaler AnyCall, selective AnyCall und double selective AnyCall"
    spec: "A.5.2.4.8"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-011-1
        text: "Ein AnyCall fordert Antworten an."
        status: open
      - id: AC-ADDR-011-2
        text: "Ein AnyCall benennt keine bestimmten Empfänger."
        status: open
      - id: AC-ADDR-011-3
        text: "Die globale AnyCall-Adresse ist „@@?“."
        status: open
      - id: AC-ADDR-011-4
        text: "Ein selective AnyCall legt das letzte einzelne Zeichen der Zieladressen fest."
        status: open
      - id: AC-ADDR-011-5
        text: "Ein double selective AnyCall legt die letzten zwei Zeichen der Zieladressen fest."
        status: open
      - id: AC-ADDR-011-6
        text: "Ein double selective AnyCall wird verwendet, wenn engere Akzeptanz- und Antwortkriterien erforderlich sind."
        status: open
  - id: REQ-ADDR-012
    title: "Wildcard-Zeichen und gleichlange Adresslängen"
    spec: "A.5.2.4.9 / Table A-XI"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-012-1
        text: "Ein Wildcard-Zeichen kann Mehrstationsadressen mit einer einzigen Rufadresse ansprechen."
        status: open
      - id: AC-ADDR-012-2
        text: "Empfänger akzeptieren das Wildcard-Zeichen als Ersatz für jedes alphanumerische Zeichen an derselben Position."
        status: open
      - id: AC-ADDR-012-3
        text: "Jedes Wildcard-Zeichen steht für eines von 36 Zeichen des Basic-38-Satzes."
        status: open
      - id: AC-ADDR-012-4
        text: "Die Länge der rufenden und der gerufenen Adresse ist gleich."
        status: open
      - id: AC-ADDR-012-5
        text: "Das spezielle Wildcard-Zeichen ist „?“."
        status: open
  - id: REQ-ADDR-013
    title: "Selbstadressierung mit eigenen Adressen"
    spec: "A.5.2.4.10"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-013-1
        text: "Stationen können ihre eigenen Adressen in Rufen verwenden."
        status: open
      - id: AC-ADDR-013-2
        text: "Selbstadressierung wird für Selbsttest, Wartung und andere Zwecke unterstützt."
        status: open
      - id: AC-ADDR-013-3
        text: "Spezifisch adressierte Calling Cycles sind zulässig, sofern sie kein AllCall und kein AnyCall sind."
        status: open
      - id: AC-ADDR-013-4
        text: "Eine Station darf eine oder mehrere ihrer eigenen Rufadressen in den Calling Cycle einsetzen oder hinzufügen."
        status: open
  - id: REQ-ADDR-014
    title: "Null-Adresse ohne Ziel, Antwort oder Annahme"
    spec: "A.5.2.4.11"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-014-1
        text: "Eine Null-Adresse ist weder adressiert noch angenommen noch beantwortet."
        status: open
      - id: AC-ADDR-014-2
        text: "Die spezielle Null-Adress-Form ist „TO @@@“ oder „REP @@@“ unter der angegebenen Folgebedingung."
        status: open
      - id: AC-ADDR-014-3
        text: "Die Null-Adresse verwendet nur TO oder REP."
        status: open
      - id: AC-ADDR-014-4
        text: "Die Null-Adresse wird nur im Calling Cycle verwendet."
        status: open
      - id: AC-ADDR-014-5
        text: "In Gruppenrufen erscheint die Null-Adresse nur im führenden Ruf und nicht im Scanning Call."
        status: open
      - id: AC-ADDR-014-6
        text: "Null-Adressen werden niemals in der Schlusssequenz verwendet."
        status: open
      - id: AC-ADDR-014-7
        text: "Ein gruppenrufbezogener Slot bleibt leer, wenn eine Null-Adresse dort verwendet wird."
        status: open
  - id: REQ-ADDR-015
    title: "In-Link-Adresse für alle Mitglieder eines Links"
    spec: "A.5.2.4.12"
    priority: MUST
    status: offen
    ac:
      - id: AC-ADDR-015-1
        text: "Die In-Link-Adresse gilt für alle Mitglieder des etablierten Links."
        status: open
      - id: AC-ADDR-015-2
        text: "Die In-Link-Adresse ist „?@?“."
        status: open
      - id: AC-ADDR-015-3
        text: "Ein Funkgerät erweitert im verknüpften Zustand seine als eigene Adressen erkannten Adressen um die In-Link-Adresse."
        status: open
      - id: AC-ADDR-015-4
