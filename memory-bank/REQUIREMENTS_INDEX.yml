        text: "Das System muss mindestens 20 Selbstadresssätze speichern können."
        status: open
      - id: AC-GEN-014-2
        text: "Der Selbstadressspeicher muss nichtflüchtig sein."
        status: open
      - id: AC-GEN-014-3
