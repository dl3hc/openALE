        status: open
  - id: REQ-GEN-008
    title: "AQC-ALE Rückwärtskompatibilität: Scan-Raten 2 und 5 Kanäle/s"
    spec: "A.4.2.1.2"
    priority: SHOULD
    status: offen
    ac:
      - id: AC-GEN-008-1
