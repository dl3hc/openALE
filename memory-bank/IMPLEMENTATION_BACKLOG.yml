  acceptance_criteria:
  - id: AC-ADDR-001-1
    text: Das System verwendet eine digitale Adressstruktur auf Basis des 24-Bit-Worts und des Basic-38-Zeichensatzes.
    status: open
  - id: AC-ADDR-001-2
    text: Eine Station kann mit einer oder mehreren vorab vereinbarten oder bedarfsabhängigen Stationen verlinken oder vernetzen.
    status: open
  - id: AC-ADDR-001-3
    text: Das System kann mindestens 20 eigene Adressen verwalten.
    status: open
  - id: AC-ADDR-001-4
    text: Jede dieser eigenen Adressen kann bis zu 15 Zeichen lang sein.
    status: open
  - id: AC-ADDR-001-5
    text: Das System unterstützt Einzelstation-, Mehrfachstation- und Sondermodi der Adressierung.
    status: open
  - id: AC-ADDR-001-6
    text: Adresskombinationen mit Sonderbedeutung werden kontrolliert oder eingeschränkt behandelt.
    status: open
  - id: AC-ADDR-002-1
    text: Der Basic-38-ASCII-Zeichensatz umfasst A bis Z, 0 bis 9, „@“ und „?“.
    status: open
  - id: AC-ADDR-002-2
    text: Der Basic-38-ASCII-Zeichensatz wird für alle grundlegenden Adressierungsfunktionen verwendet.
    status: open
  - id: AC-ADDR-002-3
    text: Eine gültige Basisadresse enthält ein Routing-Präambelwort und drei Zeichen aus dem Basic-38-ASCII-Zeichensatz.
    status: open
  - id: AC-ADDR-002-4
    text: Die Sonderzeichen „@“ und „?“ werden für spezielle Funktionen verwendet.
    status: open
  - id: AC-ADDR-002-5
    text: Die Erkennung von Basic-38-Zeichen darf nicht allein auf den drei höchstwertigen Bits beruhen.
    status: open
  - id: AC-ADDR-016-1
    text: Empfangene Adressen werden gegen den Basic-38-Zeichensatz und die definierten Adressstrukturen validiert.
    status: open
  - id: AC-ADDR-016-2
    text: Reservierte oder unbekannte Adressmuster werden als ungültig verworfen.
    status: open
  - id: AC-ADDR-016-3
    text: Das System arbeitet rückwärtskompatibel mit Implementierungen, die nur Basisadressen unterstützen.
    status: open
