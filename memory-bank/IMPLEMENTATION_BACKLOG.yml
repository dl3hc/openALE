    status: open
  - id: AC-ADDR-004-2
    text: Eine einer einzelnen Station zugeordnete Adresse wird als individuelle Adresse bezeichnet.
    status: open
  - id: AC-ADDR-004-3
    text: Eine einwortige individuelle Adresse wird als Basisgröße bezeichnet.
    status: open
  - id: AC-ADDR-004-4
    text: Eine mehr als ein Wort umfassende individuelle Adresse wird als erweiterte Größe bezeichnet.
    status: open
  - id: AC-ADDR-004-5
    text: Das grundlegende Adresswort kann für Intranet- und Slotted-Betrieb verwendet werden.
    status: open
  - id: AC-ADDR-004-6
    text: Das grundlegende Adresswort kann für Internet- und allgemeinen Gebrauch erweitert werden.
    status: open
  - id: AC-ADDR-005-1
    text: Nicht dargestellte Muster werden als reserviert und ungültig behandelt, bis sie standardisiert sind.
    status: open
  - id: AC-ADDR-005-2
    text: „@“ wird als Utility-Zeichen behandelt.
    status: open
  - id: AC-ADDR-005-3
    text: „?“ wird als Wildcard-Zeichen behandelt.
    status: open
  - id: AC-ADDR-005-4
    text: A, B, C und D stehen nur für Zeichen aus dem Basic-38-ASCII-Zeichensatz, die weder „@“ noch „?“ sind.
    status: open
  - id: AC-ADDR-006-1
    text: Eine Basisadresse besteht aus einem Routing-Präambelwort und drei Adresszeichen.
    status: open
  - id: AC-ADDR-006-2
    text: Eine dreistellige Einzelwortadresse ist die minimale Struktur.
    status: open
  - id: AC-ADDR-006-3
    text: Für die dreistellige individuelle Adresse ist eine Basic-38-Adresskapazität von 46.656 gegeben.
    status: open
  - id: AC-ADDR-006-4
    text: Alle eigenen Adressen sind mit spezifischen Zeit- und Steuerinformationen verknüpft.
    status: open
  - id: AC-ADDR-006-5
    text: Jede ALE-Station besitzt mindestens eine einwortige Adresse für einwortige Adressprotokolle.
    status: open
  - id: AC-ADDR-006-6
    text: Längere Adressen werden durch das Design nicht ausgeschlossen.
    status: open
  - id: AC-ADDR-007-1
    text: Erweiterte Adressen können länger als ein Wort sein.
    status: open
  - id: AC-ADDR-007-2
    text: Erweiterte Adressen überschreiten nicht fünf Wörter.
    status: open
  - id: AC-ADDR-007-3
    text: Erweiterte Adressen überschreiten nicht 15 Zeichen.
    status: open
  - id: AC-ADDR-007-4
    text: Eine erweiterte Adresse beginnt mit einem Basisadresswort wie TO oder TIS.
    status: open
  - id: AC-ADDR-007-5
    text: Weitere Zeichen werden über zusätzliche Wörter in der Folge DATA, REP, DATA, REP aufgenommen.
    status: open
  - id: AC-ADDR-007-6
    text: Alle Adresszeichen stammen aus dem Basic-38-ASCII-Zeichensatz.
    status: open
  tests:
  - file: tests/test_protocol.cpp
    description: Verifikation für FEAT-ADDR-002
  notes: 'chunk_address(): i+=3, ''@''-Pad. Max 15 Zeichen = 5 Wörter. Sequenz TO→DATA→REP→DATA→REP.'
- id: FEAT-ADDR-003
  title: Net, Group, AllCall, AnyCall Adressen
  status: todo
  priority: MUST
  implements:
  - REQ-ADDR-008
  - REQ-ADDR-009
  - REQ-ADDR-010
  - REQ-ADDR-011
  design_ref: FEAT-ADDR-003
  module:
  - src/ale_state_machine.cpp
  - src/ale_word.cpp
  depends_on:
  - FEAT-ADDR-002
  acceptance_criteria:
  - id: AC-ADDR-008-1
    text: Ein Netzruf verwendet eine einzige gemeinsam zugewiesene Netadresse.
    status: open
  - id: AC-ADDR-008-2
    text: Die rufende Station verwendet eine Adressstruktur, die der individuellen Stationsadresse entspricht.
    status: open
  - id: AC-ADDR-008-3
    text: Eine Netmitgliedsstation besitzt je Netadresse einen Response-Slot-Identifikator.
    status: open
  - id: AC-ADDR-008-4
    text: Ein Slot-Width-Modifikator ist vorhanden, wenn das Standardprotokoll dies vorgibt.
    status: open
  - id: AC-ADDR-008-5
    text: Zusätzliche Informationen zu zugewiesenen Response-Slots und deren Größe sind verfügbar.
    status: open
  - id: AC-ADDR-008-6
    text: Das Mischen von individuellen, Netz- und Gruppenadressen sowie -rufen ist eingeschränkt.
    status: open
  - id: AC-ADDR-009-1
    text: Ein Gruppenruf verwendet mehrere nicht vorab vereinbarte Stationsadressen in einer kompakten Kombination.
    status: open
  - id: AC-ADDR-009-2
    text: Die rufende Station verwendet die tatsächlichen individuellen Stationsadressen der gerufenen Stationen.
    status: open
  - id: AC-ADDR-009-3
    text: Die Reihenfolge folgt dem spezifischen Standardprotokoll.
    status: open
  - id: AC-ADDR-009-4
    text: Eine Stationsadresse erscheint in einer Gruppenruf-Folge nicht mehr als einmal, außer wenn das Gruppenrufprotokoll
      di...
    status: open
  - id: AC-ADDR-010-1
    text: Ein AllCall fordert keine Antworten an.
    status: open
  - id: AC-ADDR-010-2
    text: Ein AllCall bezeichnet keine spezifische Adresse.
    status: open
  - id: AC-ADDR-010-3
    text: Die globale AllCall-Adresse ist „@?@“.
    status: open
  - id: AC-ADDR-010-4
    text: Ein selective AllCall legt das letzte einzelne Zeichen der Zieladressen fest.
    status: open
  - id: AC-ADDR-010-5
    text: Bei mehr als einer Teilmenge darf die selective-AllCall-Adressierung eine THRU/REP-Folge verwenden.
    status: open
  - id: AC-ADDR-010-6
    text: Die ausgewählten Zeichen bestimmen, welche Stationen das Scannen beenden und zuhören.
    status: open
  - id: AC-ADDR-011-1
    text: Ein AnyCall fordert Antworten an.
    status: open
  - id: AC-ADDR-011-2
    text: Ein AnyCall benennt keine bestimmten Empfänger.
    status: open
  - id: AC-ADDR-011-3
    text: Die globale AnyCall-Adresse ist „@@?“.
    status: open
  - id: AC-ADDR-011-4
    text: Ein selective AnyCall legt das letzte einzelne Zeichen der Zieladressen fest.
    status: open
  - id: AC-ADDR-011-5
    text: Ein double selective AnyCall legt die letzten zwei Zeichen der Zieladressen fest.
    status: open
  - id: AC-ADDR-011-6
    text: Ein double selective AnyCall wird verwendet, wenn engere Akzeptanz- und Antwortkriterien erforderlich sind.
    status: open
  tests:
  - file: tests/test_protocol.cpp
    description: Verifikation für FEAT-ADDR-003
  notes: AllCall='@?@', AnyCall='@@?'. Netz-Adresse mit TO. Group nutzt THRU/REP. Slot-Identifikatoren für Netz.
- id: FEAT-ADDR-004
  title: Wildcard-Matching
  status: validate
  priority: MUST
  implements:
  - REQ-ADDR-012
  design_ref: FEAT-ADDR-004
  module:
  - src/ale_word.cpp
  depends_on:
  - FEAT-ADDR-001
  acceptance_criteria:
  - id: AC-ADDR-012-1
    text: Ein Wildcard-Zeichen kann Mehrstationsadressen mit einer einzigen Rufadresse ansprechen.
    status: open
  - id: AC-ADDR-012-2
    text: Empfänger akzeptieren das Wildcard-Zeichen als Ersatz für jedes alphanumerische Zeichen an derselben Position.
    status: open
  - id: AC-ADDR-012-3
    text: Jedes Wildcard-Zeichen steht für eines von 36 Zeichen des Basic-38-Satzes.
    status: open
  - id: AC-ADDR-012-4
    text: Die Länge der rufenden und der gerufenen Adresse ist gleich.
    status: open
  - id: AC-ADDR-012-5
    text: Das spezielle Wildcard-Zeichen ist „?“.
    status: open
  tests:
  - file: tests/test_protocol.cpp
    description: Verifikation für FEAT-ADDR-004
  notes: 'match_wildcard(): ''?'' = ein beliebiges alphanumerisches Zeichen. Muster- und Adresslänge müssen gleich sein.'
- id: FEAT-ADDR-005
  title: Self, Null, In-Link Adressen
  status: todo
  priority: MUST
  implements:
  - REQ-ADDR-013
  - REQ-ADDR-014
  - REQ-ADDR-015
  design_ref: FEAT-ADDR-005
  module:
  - src/ale_word.cpp
  - src/ale_state_machine.cpp
  depends_on:
  - FEAT-ADDR-002
  acceptance_criteria:
  - id: AC-ADDR-013-1
    text: Stationen können ihre eigenen Adressen in Rufen verwenden.
    status: open
  - id: AC-ADDR-013-2
    text: Selbstadressierung wird für Selbsttest, Wartung und andere Zwecke unterstützt.
    status: open
  - id: AC-ADDR-013-3
    text: Spezifisch adressierte Calling Cycles sind zulässig, sofern sie kein AllCall und kein AnyCall sind.
    status: open
  - id: AC-ADDR-013-4
    text: Eine Station darf eine oder mehrere ihrer eigenen Rufadressen in den Calling Cycle einsetzen oder hinzufügen.
    status: open
  - id: AC-ADDR-014-1
    text: Eine Null-Adresse ist weder adressiert noch angenommen noch beantwortet.
    status: open
  - id: AC-ADDR-014-2
    text: Die spezielle Null-Adress-Form ist „TO @@@“ oder „REP @@@“ unter der angegebenen Folgebedingung.
    status: open
  - id: AC-ADDR-014-3
    text: Die Null-Adresse verwendet nur TO oder REP.
    status: open
  - id: AC-ADDR-014-4
    text: Die Null-Adresse wird nur im Calling Cycle verwendet.
    status: open
  - id: AC-ADDR-014-5
    text: In Gruppenrufen erscheint die Null-Adresse nur im führenden Ruf und nicht im Scanning Call.
    status: open
  - id: AC-ADDR-014-6
    text: Null-Adressen werden niemals in der Schlusssequenz verwendet.
    status: open
  - id: AC-ADDR-014-7
    text: Ein gruppenrufbezogener Slot bleibt leer, wenn eine Null-Adresse dort verwendet wird.
    status: open
  - id: AC-ADDR-015-1
    text: Die In-Link-Adresse gilt für alle Mitglieder des etablierten Links.
    status: open
  - id: AC-ADDR-015-2
    text: Die In-Link-Adresse ist „?@?“.
    status: open
  - id: AC-ADDR-015-3
    text: Ein Funkgerät erweitert im verknüpften Zustand seine als eigene Adressen erkannten Adressen um die In-Link-Adresse.
    status: open
  - id: AC-ADDR-015-4
    text: Ein Frame mit In-Link-Adresse adressiert alle Mitglieder öffentlich.
    status: open
  - id: AC-ADDR-015-5
    text: Ein Frame mit TWAS-Präambel signalisiert allen Mitgliedern, dass die sendende Station den Link verlassen hat.
    status: open
  tests:
  - file: tests/test_protocol.cpp
    description: Verifikation für FEAT-ADDR-005
  notes: 'Null=''@@@'' (nur TO/REP im Calling Cycle). In-Link=''?@?'' (alle Link-Mitglieder). Self: mehrere Adressen möglich.'
